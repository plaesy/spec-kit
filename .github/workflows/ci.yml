name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bash-lint:
    name: Bash syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax of all scripts
        run: |
          set -e
          for f in $(find scripts testing \( -name '*.sh' \) | sort); do
            bash -n "$f" && echo "OK: $f"
          done
          for f in $(find scripts/bash \( -name '*.awk' \) | sort); do
            tmpcand=$(mktemp)
            printf 'dummy-candidate\n' > "$tmpcand"
            awk -v candfile="$tmpcand" -f "$f" /dev/null </dev/null && echo "OK: $f" || echo "SKIP(awk): $f"
            rm -f "$tmpcand"
          done
      - name: Run bash test suite (syntax only)
        run: |
          bash testing/bash/run.sh --no-functional

  smoke-test:
    name: E2E smoke test (graph + analyze)
    runs-on: ubuntu-latest
    needs: bash-lint
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test
        run: bash testing/smoke/smoke-e2e.sh

  powershell-lint:
    name: PowerShell 5.1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax of all scripts
        shell: pwsh
        run: |
          $errs = $null; $toks = $null; $failed = $false
          Get-ChildItem -Path scripts/powershell -Filter *.ps1 -Recurse | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$toks, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              Write-Error "PARSE FAIL: $($_.Name): $($errs[0].Message)"
              $failed = $true
            } else {
              Write-Output "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  powershell-core:
    name: PowerShell 7 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell 7
        run: |
          . /etc/os-release
          sudo apt-get update -qq
          sudo apt-get install -yqq powershell
      - name: Check PowerShell syntax of all scripts
        shell: bash
        run: |
          set -e
          for f in $(find scripts/powershell -name '*.ps1' | sort); do
            pwsh -NoProfile -Command "\$e = \$null; [System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$null, [ref]\$e) > /dev/null; if (\$e -and \$e.Count -gt 0) { throw \"$f: \$(\$e[0].Message)\" }" && echo "OK: $f"
          done

  powershell-smoke:
    name: PowerShell smoke (path helpers)
    runs-on: windows-latest
    needs: powershell-lint
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell smoke test
        shell: pwsh
        run: ./testing/smoke/smoke-powershell.ps1
