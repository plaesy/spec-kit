name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build, vet, test (Go)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go.mod
      - name: go build
        working-directory: scripts
        run: go build ./...
      - name: go vet
        working-directory: scripts
        run: go vet ./...
      - name: go test
        working-directory: scripts
        run: go test ./...
