name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bash-lint:
    name: Bash syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax of all scripts
        run: |
          set -e
          for f in $(find scripts testing \( -name '*.sh' \) | sort); do
            bash -n "$f" && echo "OK: $f"
          done
          for f in $(find scripts/bash \( -name '*.awk' \) | sort); do
            tmpcand=$(mktemp)
            printf 'dummy-candidate\n' > "$tmpcand"
            awk -v candfile="$tmpcand" -f "$f" /dev/null </dev/null && echo "OK: $f" || echo "SKIP(awk): $f"
            rm -f "$tmpcand"
          done
      - name: Run bash test suite (syntax only)
        run: |
          bash testing/bash/run.sh --no-functional

  shellcheck:
    name: ShellCheck static analysis
    runs-on: ubuntu-latest
    # Non-blocking for now: repo has never run ShellCheck before, so pre-existing
    # warnings are unknown. Flip to blocking once the backlog is triaged/fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          set -e
          for f in $(find scripts/bash testing -name '*.sh' | sort); do
            shellcheck -S warning "$f"
          done

  smoke-test:
    name: E2E smoke test (graph + analyze)
    runs-on: ubuntu-latest
    needs: bash-lint
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test
        run: bash testing/smoke/smoke-e2e.sh
      - name: Run analyzer functional smoke test
        run: bash testing/smoke/smoke-analyze.sh

  analyzer-parity:
    name: Analyzer Bash/PowerShell parity
    runs-on: ubuntu-latest
    needs: bash-lint
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell 7
        run: |
          . /etc/os-release
          sudo apt-get update -qq
          sudo apt-get install -yqq powershell
      - name: Run analyzer functional smoke test (PowerShell)
        run: |
          pwsh -NoProfile -Command "./testing/smoke/smoke-analyze.ps1"
      - name: Compare Bash and PowerShell analyzer output parity
        run: |
          set -e
          # Run both analyzers on the same fixture and compare key fields
          WORK=$(mktemp -d)
          FIXTURE="$WORK/project"
          mkdir -p "$FIXTURE/src" "$FIXTURE/docs"
          cat > "$FIXTURE/README.md" <<'EOF'
          # Parity Fixture
          See [docs/guide.md](docs/guide.md) and [src/lib.js](src/lib.js).
          EOF
          cat > "$FIXTURE/package.json" <<'EOF'
          {
            "name": "parity-fixture",
            "version": "1.0.0",
            "dependencies": { "express": "^4.18.0" }
          }
          EOF
          cat > "$FIXTURE/docs/guide.md" <<'EOF'
          # Guide
          Imports [src/lib.js](src/lib.js).
          EOF
          cat > "$FIXTURE/src/lib.js" <<'EOF'
          export function lib() { return "ok"; }
          EOF
          
          bash scripts/bash/plaesy-analyze.sh "$FIXTURE" --no-graph
          pwsh -NoProfile -Command "./scripts/powershell/plaesy-analyze.ps1 -ProjectPath '$FIXTURE' -NoGraph"
          
          BASH_JSON=$(cat "$FIXTURE/.plaesy/analysis/project.json")
          PS_JSON=$(pwsh -NoProfile -Command "Get-Content '$FIXTURE/.plaesy/analysis/project.json' -Raw")
          
          # Both should detect express
          if echo "$BASH_JSON" | grep -q "express" && echo "$PS_JSON" | grep -q "express"; then
            echo "PASS: Both analyzers detect express framework"
          else
            echo "FAIL: Framework detection parity mismatch"
            exit 1
          fi
          
          # Both should detect JavaScript
          if echo "$BASH_JSON" | grep -q "JavaScript" && echo "$PS_JSON" | grep -q "JavaScript"; then
            echo "PASS: Both analyzers detect JavaScript language"
          else
            echo "FAIL: Language detection parity mismatch"
            exit 1
          fi
          
          rm -rf "$WORK"
          echo "PASS: All parity checks passed"

  powershell-lint:
    name: PowerShell 5.1 syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax of all scripts
        shell: pwsh
        run: |
          $errs = $null; $toks = $null; $failed = $false
          Get-ChildItem -Path scripts/powershell -Filter *.ps1 -Recurse | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$toks, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              Write-Error "PARSE FAIL: $($_.Name): $($errs[0].Message)"
              $failed = $true
            } else {
              Write-Output "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

  powershell-core:
    name: PowerShell 7 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell 7
        run: |
          . /etc/os-release
          sudo apt-get update -qq
          sudo apt-get install -yqq powershell
      - name: Check PowerShell syntax of all scripts
        shell: bash
        run: |
          set -e
          for f in $(find scripts/powershell -name '*.ps1' | sort); do
            pwsh -NoProfile -Command "\$e = \$null; [System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$null, [ref]\$e) > /dev/null; if (\$e -and \$e.Count -gt 0) { throw \"$f: \$(\$e[0].Message)\" }" && echo "OK: $f"
          done

  powershell-smoke:
    name: PowerShell smoke (path helpers)
    runs-on: windows-latest
    needs: powershell-lint
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell smoke test
        shell: pwsh
        run: ./testing/smoke/smoke-powershell.ps1
      - name: Run analyzer functional smoke test
        shell: pwsh
        run: ./testing/smoke/smoke-analyze.ps1
