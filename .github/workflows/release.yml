name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Each target builds natively on a runner whose OS/arch matches the
    # target, with CGO_ENABLED=1 (the default for a native build). The
    # search embedder links github.com/yalue/onnxruntime_go, a cgo-only
    # package with no pure-Go fallback — cross-compiling it with
    # CGO_ENABLED=0 from a single runner fails for every target
    # ("build constraints exclude all Go files"). See
    # .plaesy/decisions/release-native-matrix-cgo.md.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: ""
          - os: macos-13
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/go.mod
      - name: Build native binary
        working-directory: scripts
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist
          go build \
            -ldflags "-X github.com/plaesy/spec-kit/internal/common.Version=${GITHUB_REF#refs/tags/v}" \
            -o "../dist/plaesy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            ./cmd/plaesy
      - uses: actions/upload-artifact@v4
        with:
          name: plaesy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/plaesy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plaesy-linux-amd64
            dist/plaesy-linux-arm64
            dist/plaesy-darwin-amd64
            dist/plaesy-darwin-arm64
            dist/plaesy-windows-amd64.exe
          generate_release_notes: true
